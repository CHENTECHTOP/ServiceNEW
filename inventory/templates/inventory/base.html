<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервісний центр | Ремонт пристроїв</title>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: linear-gradient(135deg, #111827, #2e1065, #3b0764);
            color: #f3f4f6;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes superSmoothSlide {
            0% {
                opacity: 0;
                transform: translateY(-60px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-smooth {
            animation: superSmoothSlide 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal-on-scroll.active {
            opacity: 1;
            transform: translateY(0);
        }

        .header-bar {
            width: 100%;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .site-title { font-size: 20px; font-weight: 700; color: #e9d5ff; display: flex; align-items: center; gap: 8px; }
        .header-btn {
            background: rgba(147, 51, 234, 0.25);
            border: 1px solid rgba(192, 132, 252, 0.4);
            color: #e9d5ff;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .header-btn:hover { background: rgba(147, 51, 234, 0.5); color: #ffffff; border-color: #c084fc; }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .hero-section {
            min-height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px 15px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 28px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            max-width: 500px;
        }
        .container.wide { max-width: 850px; }

        h2 { margin-top: 0; text-align: center; margin-bottom: 20px; font-size: 22px; color: #f3f4f6; }
        .form-group { margin-bottom: 14px; }
        .form-label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; color: #e2e8f0; }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.95);
            color: #1f2937;
            font-size: 14px;
        }
        .btn {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
        }
        .btn:hover { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
    </style>
</head>
<body>

    <header class="header-bar">
        <div class="site-title">🛠️ PhoneKivka</div>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="header-btn">Панель замовлень</a>
            {% else %}
                <a href="{% url 'login' %}" class="header-btn">🔑 Вхід для майстра</a>
            {% endif %}
        </div>
    </header>

    <div class="main-wrapper">
        <section class="hero-section">
            <div class="container animate-smooth {% block container_class %}{% endblock %}">
                {% block content %}{% endblock %}
            </div>
        </section>

        {% block extra_content %}{% endblock %}
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.15 });

            document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
